<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ProjectHub – Hub Innowacji Społecznych Małopolski</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <a class="skip" href="#app">Przejdź do treści</a>
    <header>
      <b>ProjectHub</b>
      <nav aria-label="Menu główne">
        <a href="#" data-r="" data-role="obywatel">Mam problem</a
        ><a href="#projekty" data-r="projekty" data-role="obywatel">Głosuj</a
        ><a href="#projekt" data-r="projekt" data-role="urzednik"
          >Zarządzaj projektami</a
        ><a href="#panel" data-r="panel" data-role="urzednik">Panel urzędnika</a
        ><a
          href="#wybor"
          data-r="wybor"
          data-role="any"
          id="navWyjdz"
          data-act="logout"
          style="opacity: 0.85"
          >Wyloguj</a
        >
      </nav>
      <button
        class="a11y-btn"
        id="a11yBtn"
        aria-expanded="false"
        aria-controls="a11yPanel"
      >
        Ułatwienia
      </button>
      <div
        class="a11y-panel"
        id="a11yPanel"
        hidden
        role="group"
        aria-label="Menu ułatwień dostępności"
      >
        <b>Rozmiar czcionki:</b>
        <button id="fs90" data-fs="90" aria-pressed="false">A−</button
        ><button id="fs100" data-fs="100" aria-pressed="true">A</button
        ><button id="fs115" data-fs="115" aria-pressed="false">A+</button>
        <button id="hcBtn" aria-pressed="false">Wysoki kontrast</button>
        <button id="animBtn" aria-pressed="false">Wyłącz animacje</button>
        <button id="resetBtn">Przywróć domyślne</button>
      </div>
      <span
        id="whoami"
        style="margin-left: 0; font-size: 0.95rem; opacity: 0.9"
      ></span>
    </header>
    <main id="app" tabindex="-1" aria-live="polite"></main>
  <footer>
    <p>&copy; 2026 ProjectHub – Hub Innowacji Społecznych Małopolski</p>
  </footer>
  </body>
</html>
